esphome:
  name: esp-achterdeur

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: " Fallback Hotspot"
    password: "blaatblaat"

captive_portal:

uart:
  id: uart_bus
  tx_pin: GPIO17  # Connect to MH-Z19 RX
  rx_pin: GPIO16  # Connect to MH-Z19 TX
  baud_rate: 9600

binary_sensor:
#  - name: "PIR Sensor 1"
#    platform: gpio
#    pin: 21
#    device_class: motion

  - name: "Door sensor achterdeur"
    platform: gpio
    pin:
      number: GPIO23
      mode: INPUT_PULLUP

    filters:
      - delayed_on_off: 100ms
    device_class: door

sensor:
  - platform: mhz19
    id: mhz19_component_id
    uart_id: uart_bus
    automatic_baseline_calibration: false
    warmup_time: 120s
    co2:
      name: MH-Z19 CO2 Value
      id: mhz19_co2
      accuracy_decimals: 0
    temperature:
      name: Temperature Achterdeur (MH-Z19)
      unit_of_measurement: "°C"
      accuracy_decimals: 1

button:
  - platform: template
    name: "Calibrate Zero (400ppm)"
    on_press:
      - mhz19.calibrate_zero: mhz19_component_id