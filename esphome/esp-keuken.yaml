esphome:
  name: esp-keuken

esp32:
  board: esp32dev
  framework:
    type: esp-idf


# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "5Qd1ZvQzSCHl74r4AFitT6ZSVFVjaGEuAJvZYHakxPs="

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

light:
  - platform: monochromatic
    name: "Kitchen lights"
    output: pwm1
    id: ledstrip1
    gamma_correct: 1.0
    default_transition_length: 500ms

output:
  - platform: ledc
    pin: GPIO14
    id: pwm1
    frequency: 4882Hz

binary_sensor:
  - name: "Touch Sensor 1"
    platform: gpio
    pin: GPIO33
    on_press:
      then:
        light.toggle: ledstrip1
  - name: "Touch Sensor 2"
    platform: gpio
    pin: GPIO34
    on_press:
      then:
        light.toggle: ledstrip1