esphome:
  name: poe-test
  friendly_name: POE-test

esp32:
  board: esp32-p4-evboard
  flash_size: 16MB
  framework:
    type: esp-idf

logger:
  hardware_uart: UART0

api:
  encryption:
    key: "5Qd1ZvQzSCHl74r4AFitT6ZSVFVjaGEuAJvZYHakxPs="

ota:
  - platform: esphome
    password: "2a9ffcb0eb831e3292dcd9b21bbd6295"

ethernet:
  type: IP101
  mdc_pin: GPIO31
  mdio_pin: GPIO52
  clk:
    mode: CLK_EXT_IN
    pin: GPIO50
  phy_addr: 1
  power_pin: GPIO51

#
#  # Optional but useful
##  manual_ip:
##    static_ip: 192.168.2.40
##    gateway: 192.168.2.1
##    subnet: 255.255.255.0
#
#  # Fallback if Ethernet fails
#  domain: .local

one_wire:
  - platform: gpio
    pin: GPIO20

sensor:
  - platform: dallas_temp
    name: temperature_meterkast
    unit_of_measurement: "°C"
    device_class: "temperature"
    state_class: "measurement"
    accuracy_decimals: 1

binary_sensor:
  - name: "PIR Sensor 1"
    platform: gpio
    pin: 21
    device_class: motion

  - name: "Door sensor 1"
    platform: gpio
    pin:
      number: GPIO22
      mode: INPUT_PULLUP

    filters:
      - delayed_on_off: 100ms
    device_class: door
