  - platform: rotary_encoder
    filters:
      - debounce: 10ms
    id: light_encoder_1
    pin_a:
      number: GPIO16
      mode: INPUT_PULLUP
    pin_b:
      number: GPIO17
      mode: INPUT_PULLUP
    resolution: 1
    on_clockwise:
      - light.dim_relative:
          id: ledstrip1
          relative_brightness: 10%
    on_anticlockwise:
      - light.dim_relative:
          id: ledstrip1
          relative_brightness: -10%
#
  - platform: rotary_encoder
    filters:
      - debounce: 10ms
    id: light_encoder_2
    pin_a:
      number: GPIO06
      mode: INPUT_PULLUP
    pin_b:
      number: GPIO14
      mode: INPUT_PULLUP
    resolution: 1
    on_clockwise:
      - light.dim_relative:
          id: ledstrip2
          relative_brightness: 10%
    on_anticlockwise:
      - light.dim_relative:
          id: ledstrip2
          relative_brightness: -10%

  - platform: rotary_encoder
    filters:
      - debounce: 10ms
    id: light_encoder_3
    pin_a:
      number: GPIO03
      mode: INPUT_PULLUP
    pin_b:
      number: GPIO04
      mode: INPUT_PULLUP
    resolution: 1
    on_clockwise:
      - light.dim_relative:
          id: ledstrip3
          relative_brightness: 10%
    on_anticlockwise:
      - light.dim_relative:
          id: ledstrip3
          relative_brightness: -10%

light:
  - platform: monochromatic
    name: "Test lights 1"
    output: pwm1
    id: ledstrip1
  - platform: monochromatic
    name: "Test lights 2"
    output: pwm2
    id: ledstrip2
  - platform: monochromatic
    name: "Test lights 3"
    output: pwm3
    id: ledstrip3

output:
  - platform: ledc
    pin: GPIO23
    id: pwm1
    channel: 0
  - platform: ledc
    pin: GPIO22
    id: pwm2
    channel: 2
  - platform: ledc
    pin: GPIO26
    id: pwm3
    channel: 4
#
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO18
      inverted: true
      mode:
        input: true
        pullup: true
    name: button1
    filters:
      - delayed_on: 10ms
    on_press:
      then:
        light.toggle: ledstrip1
#
  - platform: gpio
    pin:
      number: GPIO15
      inverted: true
      mode:
        input: true
        pullup: true
    name: button2
    filters:
      - delayed_on: 10ms
    on_press:
      then:
        light.toggle: ledstrip2

  - platform: gpio
    pin:
      number: GPIO05
      inverted: true
      mode:
        input: true
        pullup: true
    name: button3
    filters:
      - delayed_on: 10ms
    on_press:
      then:
        light.toggle: ledstrip3


