esphome:
  name: esp-martin-pc
  friendly_name: ESP-P4-ETH PC Martin

esp32:
  board: esp32-p4-evboard
  flash_size: 16MB
  framework:
    type: esp-idf

logger:
  hardware_uart: UART0
  level: WARN          # Global default level

api:
  encryption:
    key: !secret esp_p4_martin_pc

ota:
  - platform: esphome
    password: !secret ota_password

ethernet:
  type: IP101
  mdc_pin: GPIO31
  mdio_pin: GPIO52
  clk:
    mode: CLK_EXT_IN
    pin: GPIO50
  phy_addr: 1
  power_pin: GPIO51

